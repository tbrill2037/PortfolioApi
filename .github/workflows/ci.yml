name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Portfolio.sln

      - name: Build
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Publish Email Worker
        run: dotnet publish Portfolio.EmailWorker/Portfolio.EmailWorker.csproj --configuration Release

      - name: Publish Email Event Worker
        run: dotnet publish Portfolio.EmailEventWorker/Portfolio.EmailEventWorker.csproj --configuration Release

      - name: Publish Email Outbox Worker
        run: dotnet publish Portfolio.EmailOutboxWorker/Portfolio.EmailOutboxWorker.csproj --configuration Release

      - name: Publish Email DLQ Worker
        run: dotnet publish Portfolio.EmailDlqWorker/Portfolio.EmailDlqWorker.csproj --configuration Release

      - name: Test
        run: dotnet test Portfolio.UnitTests --configuration Release --no-build

      - name: Publish API
        run: dotnet publish Portfolio.Api/Portfolio.Api.csproj --configuration Release

...