name: Deploy Email Event Worker

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493534446004:role/GitHubActionsPortfolioDeploy
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install Lambda Tools
        run: |
          dotnet tool install -g Amazon.Lambda.Tools
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore Portfolio.sln

      - name: Build
        run: |
          dotnet build \
            Portfolio.EmailEventWorker/Portfolio.EmailEventWorker.csproj \
            --configuration Release \
            --no-restore

      - name: Deploy Lambda
        working-directory: Portfolio.EmailEventWorker
        run: dotnet lambda deploy-function PortfolioEmailEventsWorker