<table role="presentation"
       width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       class="email-header"
       style="
           width:100%;
           margin:0;
           padding:0;
           background-color:#ffffff;
           border-bottom:1px solid #e2e8f0;
           border-spacing:0;
           border-collapse:collapse;
       ">
    <tr>
        <td class="email-header-cell"
            style="
                padding:28px 36px;
                background-color:#ffffff;
            ">

            <table role="presentation"
                   width="100%"
                   cellpadding="0"
                   cellspacing="0"
                   border="0"
                   class="brand-table"
                   style="
                       width:100%;
                       margin:0;
                       padding:0;
                       border-spacing:0;
                       border-collapse:collapse;
                   ">
                <tr>
                    <td width="68"
                        valign="middle"
                        class="brand-logo-cell"
                        style="
                            width:68px;
                            padding:0 16px 0 0;
                            vertical-align:middle;
                        ">

                        <img src="cid:logo"
                             alt="Portfolio Studio"
                             width="68"
                             class="brand-logo"
                             style="
                                 display:block;
                                 width:68px;
                                 max-width:68px;
                                 height:auto;
                                 margin:0;
                                 padding:0;
                                 border:0;
                                 outline:none;
                                 text-decoration:none;
                                 -ms-interpolation-mode:bicubic;
                             " />
                    </td>

                    <td valign="middle"
                        class="brand-copy-cell"
                        style="
                            padding:0;
                            vertical-align:middle;
                            text-align:left;
                        ">

                        <h1 class="brand-name"
                            style="
                                margin:0;
                                padding:0;
                                color:#0f172a;
                                font-family:Arial, Helvetica, sans-serif;
                                font-size:24px;
                                font-weight:700;
                                line-height:30px;
                                letter-spacing:-0.5px;
                                text-align:left;
                            ">

                            <span class="brand-portfolio"
                                  style="color:#0EA5E9;">
                                Portfolio
                            </span>

                            <span class="brand-studio"
                                  style="color:#8B5CF6;">
                                Studio
                            </span>
                        </h1>

                        <p class="brand-tagline"
                           style="
                               margin:4px 0 0;
                               padding:0;
                               color:#64748b;
                               font-family:Arial, Helvetica, sans-serif;
                               font-size:12px;
                               font-weight:400;
                               line-height:18px;
                               letter-spacing:0.1px;
                               text-align:left;
                           ">
                            {{ Branding.Tagline }}
                        </p>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
