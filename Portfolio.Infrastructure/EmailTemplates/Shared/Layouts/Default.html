<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <meta name="x-apple-disable-message-reformatting" />

    <meta name="color-scheme"
          content="light dark" />

    <meta name="supported-color-schemes"
          content="light dark" />

    <title>Portfolio Studio</title>

    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    {{ Styles }}
</head>

<body id="body"
      style="
          width:100%;
          min-width:100%;
          margin:0;
          padding:0;
          background-color:#ffffff;
          color:#334155;
          font-family:Arial, Helvetica, sans-serif;
          -webkit-text-size-adjust:100%;
          -ms-text-size-adjust:100%;
      ">

    <div role="article"
         aria-roledescription="email"
         aria-label="Portfolio Studio"
         lang="en"
         style="
             width:100%;
             margin:0;
             padding:0;
             background-color:#ffffff;
         ">

        <table role="presentation"
               width="100%"
               cellpadding="0"
               cellspacing="0"
               border="0"
               class="email-body"
               style="
                   width:100%;
                   margin:0;
                   padding:0;
                   background-color:#ffffff;
                   border-spacing:0;
                   border-collapse:collapse;
               ">
            <tr>
                <td align="center"
                    class="email-wrapper-cell"
                    style="
                        padding:32px 16px;
                        text-align:center;
                    ">

                    <!--[if mso]>
                    <table role="presentation"
                           width="640"
                           cellpadding="0"
                           cellspacing="0"
                           border="0"
                           style="
                               width:640px;
                               border-spacing:0;
                               border-collapse:collapse;
                           ">
                        <tr>
                            <td>
                    <![endif]-->

                    <table role="presentation"
                           width="100%"
                           cellpadding="0"
                           cellspacing="0"
                           border="0"
                           class="email-container"
                           style="
                               width:100%;
                               max-width:640px;
                               margin:0 auto;
                               background-color:#ffffff;
                               border:1px solid #e2e8f0;
                               border-radius:16px;
                               border-spacing:0;
                               border-collapse:separate;
                               overflow:hidden;
                           ">

                        <tr>
                            <td class="brand-bar"
                                height="4"
                                style="
                                    height:4px;
                                    padding:0;
                                    background-color:#0EA5E9;
                                    background-image:linear-gradient(
                                        90deg,
                                        #0EA5E9 0%,
                                        #38BDF8 45%,
                                        #8B5CF6 100%
                                    );
                                    font-size:0;
                                    line-height:0;
                                ">
                                &nbsp;
                            </td>
                        </tr>

                        <tr>
                            <td style="
                                    margin:0;
                                    padding:0;
                                    background-color:#ffffff;
                                ">
                                {{ Header }}
                            </td>
                        </tr>

                        <tr>
                            <td class="email-content"
                                style="
                                    margin:0;
                                    padding:38px 36px 40px;
                                    background-color:#ffffff;
                                    color:#334155;
                                    font-family:Arial, Helvetica, sans-serif;
                                    text-align:left;
                                ">
                                {{ BodyContent }}
                            </td>
                        </tr>

                        <tr>
                            <td style="
                                    margin:0;
                                    padding:0;
                                    background-color:#ffffff;
                                ">
                                {{ Footer }}
                            </td>
                        </tr>
                    </table>

                    <!--[if mso]>
                            </td>
                        </tr>
                    </table>
                    <![endif]-->

                </td>
            </tr>
        </table>
    </div>
</body>
</html>
