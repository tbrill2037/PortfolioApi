<table role="presentation"
       width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       class="email-footer"
       style="
           width:100%;
           margin:0;
           padding:0;
           background-color:#ffffff;
           border-top:1px solid #e2e8f0;
           border-spacing:0;
           border-collapse:collapse;
       ">
    <tr>
        <td align="center"
            class="email-footer-cell"
            style="
                padding:28px 36px 30px;
                background-color:#ffffff;
                text-align:center;
            ">

            <p class="footer-brand"
               style="
                   margin:0 0 6px;
                   padding:0;
                   color:#0f172a;
                   font-family:Arial, Helvetica, sans-serif;
                   font-size:13px;
                   font-weight:700;
                   line-height:20px;
                   text-align:center;
               ">
                Portfolio Studio
            </p>

            <p class="footer-copy"
               style="
                   margin:0;
                   padding:0;
                   color:#64748b;
                   font-family:Arial, Helvetica, sans-serif;
                   font-size:12px;
                   font-weight:400;
                   line-height:19px;
                   text-align:center;
               ">
                Thoughtful software, cloud solutions, and maintainable architecture.
            </p>

            <table role="presentation"
                   align="center"
                   cellpadding="0"
                   cellspacing="0"
                   border="0"
                   class="social-table"
                   style="
                       margin:18px auto 0;
                       border-spacing:0;
                       border-collapse:collapse;
                   ">
                <tr>
                    <td class="social-cell"
                        style="padding:0 9px;">

                        <a href="{{ Branding.WebsiteUrl }}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="social-link"
                           aria-label="Portfolio"
                           style="
                               display:inline-block;
                               text-decoration:none;
                           ">

                            <img src="cid:portfolio-icon"
                                 alt="Portfolio"
                                 width="22"
                                 height="22"
                                 class="social-icon"
                                 style="
                                     display:block;
                                     width:22px;
                                     max-width:22px;
                                     height:22px;
                                     margin:0;
                                     padding:0;
                                     border:0;
                                     outline:none;
                                     text-decoration:none;
                                     -ms-interpolation-mode:bicubic;
                                 " />
                        </a>
                    </td>

                    <td class="social-cell"
                        style="padding:0 9px;">

                        <a href="{{ Branding.GitHubUrl }}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="social-link"
                           aria-label="GitHub"
                           style="
                               display:inline-block;
                               text-decoration:none;
                           ">

                            <img src="cid:github-icon"
                                 alt="GitHub"
                                 width="22"
                                 height="22"
                                 class="social-icon"
                                 style="
                                     display:block;
                                     width:22px;
                                     max-width:22px;
                                     height:22px;
                                     margin:0;
                                     padding:0;
                                     border:0;
                                     outline:none;
                                     text-decoration:none;
                                     -ms-interpolation-mode:bicubic;
                                 " />
                        </a>
                    </td>

                    <td class="social-cell"
                        style="padding:0 9px;">

                        <a href="{{ Branding.LinkedInUrl }}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="social-link"
                           aria-label="LinkedIn"
                           style="
                               display:inline-block;
                               text-decoration:none;
                           ">

                            <img src="cid:linkedin-icon"
                                 alt="LinkedIn"
                                 width="22"
                                 height="22"
                                 class="social-icon"
                                 style="
                                     display:block;
                                     width:22px;
                                     max-width:22px;
                                     height:22px;
                                     margin:0;
                                     padding:0;
                                     border:0;
                                     outline:none;
                                     text-decoration:none;
                                     -ms-interpolation-mode:bicubic;
                                 " />
                        </a>
                    </td>

                    <td class="social-cell"
                        style="padding:0 9px;">

                        <a href="{{ Branding.StackOverflowUrl }}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="social-link"
                           aria-label="Stack Overflow"
                           style="
                               display:inline-block;
                               text-decoration:none;
                           ">

                            <img src="cid:stackoverflow-icon"
                                 alt="Stack Overflow"
                                 width="22"
                                 height="22"
                                 class="social-icon"
                                 style="
                                     display:block;
                                     width:22px;
                                     max-width:22px;
                                     height:22px;
                                     margin:0;
                                     padding:0;
                                     border:0;
                                     outline:none;
                                     text-decoration:none;
                                     -ms-interpolation-mode:bicubic;
                                 " />
                        </a>
                    </td>
                </tr>
            </table>

            <p class="footer-disclaimer"
               style="
                   margin:18px 0 0;
                   padding:0;
                   color:#94a3b8;
                   font-family:Arial, Helvetica, sans-serif;
                   font-size:11px;
                   font-weight:400;
                   line-height:17px;
                   text-align:center;
               ">
                This message was sent by Portfolio Studio.
            </p>

        </td>
    </tr>
</table>
